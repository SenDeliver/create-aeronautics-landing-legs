name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository_owner == 'SenDeliver' && github.actor == 'SenDeliver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - run: ./gradlew build --no-daemon

      - name: Extract latest changelog section
        run: awk '/^## \[[0-9]/{if(f)exit;f=1;next} f' CHANGELOG.md > release-notes.md && cat release-notes.md

      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          files: build/libs/!(*-sources|*-javadoc).jar
          name: Landing Legs ${{ github.ref_name }}
          changelog-file: release-notes.md
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

          modrinth-id: landing-legs
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-dependencies: |
            create(required)
            create-aeronautics(required)
            sable(required)
            jei(optional)
            jade(optional)

          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            create(required)
            sable(required)
            jei(optional)
            jade(optional)

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: false
